name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run lint -- --max-warnings=0
          npm run test
          npm run typecheck

      - name: Validate PHP endpoints
        run: find public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build static site
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: production

      # This runs only after the public production branch is published, so database
      # credentials never enter that branch or its Git history.
      - name: Create runtime database config for hosting
        env:
          AFC_DB_HOST: localhost
          AFC_DB_USER: ${{ secrets.DB_USER }}
          AFC_DB_PASS: ${{ secrets.DB_PASS }}
          AFC_DB_NAME: ${{ secrets.DB_NAME }}
          AFC_ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          AFC_ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          php -r '
            $required = [
              "db_host" => getenv("AFC_DB_HOST"),
              "db_user" => getenv("AFC_DB_USER"),
              "db_pass" => getenv("AFC_DB_PASS"),
              "db_name" => getenv("AFC_DB_NAME"),
            ];
            foreach ($required as $value) {
              if ($value === false || $value === "") {
                fwrite(STDERR, "A required database deployment secret is missing.\n");
                exit(1);
              }
            }
            $optional = [
              "admin_username" => getenv("AFC_ADMIN_USERNAME") ?: "",
              "admin_password_hash" => getenv("AFC_ADMIN_PASSWORD_HASH") ?: "",
            ];
            $config = "<?php\n";
            foreach (array_merge($required, $optional) as $name => $value) {
              $config .= "$" . $name . " = " . var_export($value, true) . ";\n";
            }
            file_put_contents("out/api/config.php", $config, LOCK_EX);
          '
          chmod 600 out/api/config.php

      - name: FTPS deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            images/uploads/**
